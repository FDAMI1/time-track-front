name: Android APK

# Builds an installable preview APK for the Expo app in expo-app/. EAS runs locally on the
# GitHub runner, so the APK is attached to the workflow instead of being uploaded to EAS.
#
# Settings (GitHub -> Settings -> Secrets and variables -> Actions):
#   Secret    EXPO_TOKEN                 required; token for the account that owns the EAS project
#   Variable  WEB_URL                     optional; the site the app opens (default below)

on:
  workflow_dispatch:
  push:
    branches: [main, feature/portal-expansion]
    paths:
      - "expo-app/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expo-app
    env:
      EXPO_PUBLIC_WEB_URL: ${{ vars.WEB_URL || 'https://time-track-front.vercel.app' }}
      APP_VERSION_CODE: ${{ github.run_number }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Check the Expo project
        run: npx --yes expo-doctor

      - name: Build preview APK with EAS
        run: npx --yes eas-cli@latest build --local --platform android --profile preview --non-interactive --output "nfskills-portal-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nfskills-portal-apk-${{ github.run_number }}
          path: expo-app/nfskills-portal-*.apk
          if-no-files-found: error
          retention-days: 30
